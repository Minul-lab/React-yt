<!doctype html>
<html>
  <head>
    <title>Product Cart</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const ProductDetails = (props) => {
        
        const {name , price ,discountPrice,img} = props
        return (

          <div>
            <img src={img} alt="" width="200px"/>
            <p>{name}</p>
            {discountPrice ? <del><p>Price: ${price}</p></del> : <p>Price: ${price}</p>}
            
            {discountPrice && <p>DiscountPrice: {discountPrice}</p>}
            <button> Add to cart</button>
          </div>
        );
      };
      const App = () => {
        return (
          <>
            <ProductDetails  name= "Cotton Socks" price = "20" discountPrice = "5.45" img= "./images/cotton-socks.jpeg"/>
            <ProductDetails  name= "Tenis Balls" price = "6" img= "./images/tennis-ball.jpeg"/>
            <ProductDetails  name= "Plain t-shirt" price = "7.99" img= "./images/t-shirt.jpeg"/>
          </>
        );
      };
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
