<!doctype html>
<html>
  <head>
    <title>ChatBot</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0; /* Clears top, right, bottom, and left margins */
        overflow: hidden;
      }
      .appContainer {
        max-width: 650px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display:flex;
        flex-direction: column;
        
      }
    .container1 {
        display: flex;
        margin-bottom:30px
        
      } 
      .sendBtn {
        background-color: green;
        color : white;
        padding: 10px 20px;
        margin-left: 10px;
        font-size: 15px;
        border-radius: 15px;
        border: none;

      }
      .inputBox {
        padding: 10px 15px;
        border: black;
        border-radius: 10px;
        font-size: 15px;
        border: 2px solid #000000;
        flex-grow: 1
      }
      .user {
        display: flex;
        justify-content: end;
        align-items: center;
        margin: 15px
      }
      .msg {
        background-color: rgb(80, 117, 80);
        padding: 15px 18px;
        border-radius: 10px;
        font-size: 18px;
        color: white;
        max-width: 300px;
      }
      .user img{
        margin-left: 10px;
        width: 50px;
      }
      .robot {
        
        display: flex;
        justify-content: start;
        align-items: center;
        margin: 15px
      }
      .robot img{
        margin-right: 10px;
        width:50px;
      }
      .chatMsg{
        flex-grow: 1;
        margin-top: 30px;
        overflow: scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const ChatInput = ({ chatMessages, setChatMessages }) => {
        const [inputText, setInputText] = React.useState("");
        function saveInputText(event) {
          setInputText(event.target.value);
        }
        async function sendMessage(event) {
          const newChatMessages = [
            ...chatMessages,
            {
              msg: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ];

          setChatMessages(newChatMessages);

          const response = await Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              msg: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);
          setInputText("");
        }
        const handleKeyDown = (event) => {
          if (event.key === "Enter") {
            sendMessage();
          } else if (event.key === "Escape") {
            setInputText("");
          }
        };
        return (
          <div className="container1">
            <input
              type="text"
              placeholder="type a message"
              size="39"
              onChange={saveInputText}
              value={inputText}
              onKeyDown={handleKeyDown}
              className = "inputBox"
            />
            <button onClick={sendMessage} className= "sendBtn"> Send</button>
          </div>
        );
      };
      const ChatMsg = ({ msg, sender }) => {
        return (
          <div className={sender==="user"? "user":"robot"}>
            {sender === "robot" && <img src="robot.png"  />}
            <div className="msg">{msg}</div>

            {sender === "user" && <img src="user.png"  />}
          </div>
        );
      };

      function ChatMessages({ chatMessages }) {
        const chatmsgRef = React.useRef(null)
        React.useEffect(()=>{
          const containerElem = chatmsgRef.current
          containerElem.scrollTop = containerElem.scrollHeight
        },[chatMessages])
        return (
          <div className="chatMsg" ref={chatmsgRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMsg
                  msg={chatMessage.msg}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          { msg: "hello chatbot", sender: "user", id: "id1" },
          { msg: "hello how can i help you", sender: "robot", id: "id2" },
          { msg: "can you get me todays date", sender: "user", id: "id3" },
          { msg: "today is september", sender: "robot", id: "id4" },
        ]);

        return (
          <div className= "appContainer">
            
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
